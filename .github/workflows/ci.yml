name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: xcodegen
        run: brew install xcodegen && cd Makro && xcodegen generate
      - name: pods
        run: cd Makro && pod install
      - name: build (simulator, no signing)
        run: |
          cd Makro && xcodebuild -workspace Makro.xcworkspace -scheme Makro \
            -destination 'platform=iOS Simulator,name=iPhone 16' \
            CODE_SIGNING_ALLOWED=NO build | tail -20
